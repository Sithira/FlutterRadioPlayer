name: CI

on: [push, pull_request]

env:
  FLUTTER_FLOOR: 3.44.x
  FLUTTER_STABLE: 3.50.x

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: [floor, stable]
        package:
          - packages/flutter_radio_player
          - packages/flutter_radio_player_platform_interface
          - packages/flutter_radio_player_android
          - packages/flutter_radio_player_ios
        include:
          - flutter: stable
            package: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter == 'floor' && env.FLUTTER_FLOOR || env.FLUTTER_STABLE }}
      - name: pub get (floor skips examples, they need Flutter 3.47+)
        run: flutter pub get ${{ matrix.flutter == 'floor' && '--no-example' || '' }}
        working-directory: ${{ matrix.package }}
      - run: flutter analyze ${{ matrix.flutter == 'floor' && 'lib test' || '' }}
        working-directory: ${{ matrix.package }}
      - run: flutter test
        working-directory: ${{ matrix.package }}

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_STABLE }}
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
      - run: flutter build apk --release
        working-directory: example
      - run: ./gradlew :flutter_radio_player_android:testDebugUnitTest
        working-directory: example/android

  android-build-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_FLOOR }}
      - run: flutter create --platforms=android --project-name scratch_app "$RUNNER_TEMP/scratch_app"
      - run: |
          for package in flutter_radio_player_platform_interface flutter_radio_player_android flutter_radio_player_ios; do
            flutter pub add "override:$package:{\"path\":\"$GITHUB_WORKSPACE/packages/$package\"}"
          done
          flutter pub add flutter_radio_player --path "$GITHUB_WORKSPACE/packages/flutter_radio_player"
        working-directory: ${{ runner.temp }}/scratch_app
      - run: flutter build apk --debug
        working-directory: ${{ runner.temp }}/scratch_app

  ios-build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_STABLE }}
      - run: flutter config --enable-swift-package-manager
        if: matrix.package-manager == 'swiftpm'
      - run: flutter config --no-enable-swift-package-manager
        if: matrix.package-manager == 'cocoapods'
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --simulator --no-codesign
        working-directory: example

  pigeon-fresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/flutter_radio_player_android
          - packages/flutter_radio_player_ios
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_STABLE }}
      - run: flutter pub get
        working-directory: ${{ matrix.package }}
      - run: dart run pigeon --input pigeons/messages.dart
        working-directory: ${{ matrix.package }}
      - run: git diff --exit-code
