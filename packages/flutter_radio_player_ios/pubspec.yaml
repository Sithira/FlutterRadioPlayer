name: flutter_radio_player_ios
description: iOS implementation of flutter_radio_player.
version: 5.0.0-dev.1
homepage: https://github.com/Sithira/FlutterRadioPlayer
repository: https://github.com/Sithira/FlutterRadioPlayer
issue_tracker: https://github.com/Sithira/FlutterRadioPlayer/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: flutter_radio_player
    platforms:
      ios:
        dartPluginClass: FlutterRadioPlayerIos
        pluginClass: FlutterRadioPlayerPlugin

dependencies:
  flutter:
    sdk: flutter
  flutter_radio_player_platform_interface: ^5.0.0-dev.1
  meta: ^1.18.0

dev_dependencies:
  pigeon: ^30.0.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_radio_player_platform_interface:
    path: ../flutter_radio_player_platform_interface
