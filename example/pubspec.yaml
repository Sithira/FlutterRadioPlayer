name: flutter_radio_player_example
description: "Demonstrates how to use the flutter_radio_player plugin."
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_radio_player:
    path: ../packages/flutter_radio_player
  cupertino_icons: ^1.0.6
  material_ui: ^1.11.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_radio_player_platform_interface: ^5.0.0-dev.2
  plugin_platform_interface: ^2.1.7

dependency_overrides:
  flutter_radio_player:
    path: ../packages/flutter_radio_player
  flutter_radio_player_platform_interface:
    path: ../packages/flutter_radio_player_platform_interface
  flutter_radio_player_android:
    path: ../packages/flutter_radio_player_android
  flutter_radio_player_ios:
    path: ../packages/flutter_radio_player_ios

flutter:
  uses-material-design: true
  assets:
    - images/sample-cover.jpg
